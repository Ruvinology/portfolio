<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="purplegrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="cardgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.15"/>

  <!-- Grid -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1e293b" stroke-width="1"/>
  <line x1="400" y1="100" x2="400" y2="500" stroke="#1e293b" stroke-width="1"/>

  <!-- Header -->
  <rect width="800" height="60" fill="#0a0f1e"/>
  <rect width="800" height="3" y="60" fill="url(#purplegrad)"/>
  <text x="30" y="35" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Debit Card Renewal Management System</text>
  <text x="30" y="53" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Comprehensive Project Report · Business Analyst Value Addition · PHP MVC</text>
  <rect x="700" y="15" width="80" height="28" rx="6" fill="#7c3aed" opacity="0.2"/>
  <text x="740" y="33" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">BA Report</text>

  <!-- Debit card visual -->
  <rect x="40" y="85" width="320" height="195" rx="12" fill="url(#cardgrad)" stroke="#4338ca" stroke-width="1"/>
  <circle cx="340" cy="85" r="80" fill="#312e81" opacity="0.3"/>
  <circle cx="310" cy="75" r="70" fill="#1e1b4b" opacity="0.2"/>
  <!-- Card chip -->
  <rect x="65" y="120" width="45" height="35" rx="5" fill="#fbbf24" opacity="0.85"/>
  <line x1="65" y1="133" x2="110" y2="133" stroke="#92400e" stroke-width="1" opacity="0.5"/>
  <line x1="65" y1="142" x2="110" y2="142" stroke="#92400e" stroke-width="1" opacity="0.5"/>
  <line x1="87" y1="120" x2="87" y2="155" stroke="#92400e" stroke-width="1" opacity="0.5"/>
  <!-- Card number -->
  <text x="65" y="190" font-family="Courier New,monospace" font-size="14" fill="#c7d2fe" letter-spacing="3">4782  ••••  ••••  3291</text>
  <!-- Card holder -->
  <text x="65" y="215" font-family="Arial,sans-serif" font-size="10" fill="#818cf8">CARD HOLDER</text>
  <text x="65" y="228" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">RUVIN PALIHAWADANA</text>
  <!-- Expiry -->
  <text x="290" y="215" font-family="Arial,sans-serif" font-size="10" fill="#818cf8">EXPIRES</text>
  <text x="290" y="228" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">12/27</text>
  <!-- Visa logo -->
  <text x="300" y="255" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="#e0e7ff" opacity="0.7" font-style="italic">VISA</text>

  <!-- Requirements section -->
  <rect x="40" y="295" width="320" height="185" rx="8" fill="#0a0f1e" stroke="#1e293b" stroke-width="1"/>
  <text x="58" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Business Requirements</text>
  <!-- Req items -->
  <rect x="55" y="328" width="6" height="6" rx="1" fill="#7c3aed"/>
  <text x="68" y="336" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">Stakeholder Analysis &amp; Elicitation</text>
  <rect x="55" y="346" width="6" height="6" rx="1" fill="#7c3aed"/>
  <text x="68" y="354" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">Functional &amp; Non-Functional Requirements</text>
  <rect x="55" y="364" width="6" height="6" rx="1" fill="#7c3aed"/>
  <text x="68" y="372" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">Use Case Diagrams &amp; User Stories</text>
  <rect x="55" y="382" width="6" height="6" rx="1" fill="#7c3aed"/>
  <text x="68" y="390" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">Business Process Mapping (BPMN)</text>
  <rect x="55" y="400" width="6" height="6" rx="1" fill="#7c3aed"/>
  <text x="68" y="408" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">System Architecture &amp; Data Flow</text>
  <rect x="55" y="418" width="6" height="6" rx="1" fill="#7c3aed"/>
  <text x="68" y="426" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">Testing &amp; Acceptance Criteria</text>
  <rect x="55" y="436" width="6" height="6" rx="1" fill="#7c3aed"/>
  <text x="68" y="444" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">Deployment on InfinityFree · Live System</text>
  <rect x="55" y="454" width="6" height="6" rx="1" fill="#7c3aed"/>
  <text x="68" y="462" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">BA Value Addition &amp; Recommendations</text>

  <!-- Workflow diagram -->
  <rect x="420" y="75" width="355" height="405" rx="8" fill="#0a0f1e" stroke="#1e293b" stroke-width="1"/>
  <text x="440" y="100" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Card Renewal Workflow</text>

  <!-- Flow nodes -->
  <rect x="545" y="115" width="110" height="36" rx="18" fill="#7c3aed" opacity="0.8"/>
  <text x="600" y="137" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Customer Request</text>

  <line x1="600" y1="151" x2="600" y2="168" stroke="#4338ca" stroke-width="2" stroke-dasharray="4,2"/>
  <polygon points="595,168 605,168 600,175" fill="#4338ca"/>

  <rect x="545" y="175" width="110" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="600" y="197" font-family="Arial,sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">Eligibility Check</text>

  <line x1="600" y1="211" x2="600" y2="228" stroke="#4338ca" stroke-width="2" stroke-dasharray="4,2"/>
  <polygon points="595,228 605,228 600,235" fill="#4338ca"/>

  <!-- Decision diamond -->
  <polygon points="600,235 645,258 600,281 555,258" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
  <text x="600" y="262" font-family="Arial,sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">Approved?</text>

  <!-- Yes branch -->
  <line x1="600" y1="281" x2="600" y2="298" stroke="#10b981" stroke-width="2"/>
  <polygon points="595,298 605,298 600,305" fill="#10b981"/>
  <text x="615" y="295" font-family="Arial,sans-serif" font-size="9" fill="#10b981">Yes</text>

  <rect x="545" y="305" width="110" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="600" y="327" font-family="Arial,sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">Issue New Card</text>

  <!-- No branch -->
  <line x1="645" y1="258" x2="700" y2="258" stroke="#dc2626" stroke-width="2"/>
  <polygon points="700,253 700,263 707,258" fill="#dc2626"/>
  <text x="672" y="252" font-family="Arial,sans-serif" font-size="9" fill="#dc2626">No</text>

  <rect x="707" y="240" width="50" height="36" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="732" y="262" font-family="Arial,sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">Reject</text>

  <line x1="600" y1="341" x2="600" y2="358" stroke="#4338ca" stroke-width="2" stroke-dasharray="4,2"/>
  <polygon points="595,358 605,358 600,365" fill="#4338ca"/>

  <rect x="545" y="365" width="110" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="600" y="387" font-family="Arial,sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">Notify Customer</text>

  <line x1="600" y1="401" x2="600" y2="418" stroke="#4338ca" stroke-width="2" stroke-dasharray="4,2"/>
  <polygon points="595,418 605,418 600,425" fill="#4338ca"/>

  <rect x="545" y="425" width="110" height="36" rx="18" fill="#7c3aed" opacity="0.6"/>
  <text x="600" y="447" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">End</text>

  <!-- Tech stack pills -->
  <rect x="440" y="440" width="60" height="22" rx="11" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
  <text x="470" y="455" font-family="Arial,sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">PHP MVC</text>
  <rect x="440" y="415" width="60" height="22" rx="11" fill="#1a1a2e" stroke="#4338ca" stroke-width="1"/>
  <text x="470" y="430" font-family="Arial,sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">MySQL</text>
</svg>
