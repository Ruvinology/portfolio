<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a0f"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="ambergrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="hotelgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1404"/>
      <stop offset="100%" style="stop-color:#0f1a0f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>

  <!-- Grid lines -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#1c2310" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1c2310" stroke-width="1"/>
  <line x1="400" y1="100" x2="400" y2="500" stroke="#1c2310" stroke-width="1"/>

  <!-- Header -->
  <rect width="800" height="60" fill="#0a0f07"/>
  <rect width="800" height="3" y="60" fill="url(#ambergrad)"/>
  <text x="30" y="35" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">BookInn — Hotel Booking Platform</text>
  <text x="30" y="53" font-family="Arial,sans-serif" font-size="11" fill="#64748b">ICT Project Report · Full-Stack · Business Requirements &amp; System Analysis</text>
  <rect x="700" y="15" width="80" height="28" rx="6" fill="#d97706" opacity="0.2"/>
  <text x="740" y="33" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">ICT Report</text>

  <!-- Hotel building illustration -->
  <rect x="40" y="80" width="330" height="205" rx="8" fill="url(#hotelgrad)" stroke="#2c1f04" stroke-width="1"/>
  <!-- Building base -->
  <rect x="90" y="175" width="230" height="100" rx="3" fill="#1c1404"/>
  <rect x="90" y="175" width="230" height="3" fill="#f59e0b" opacity="0.5"/>
  <!-- Building upper -->
  <rect x="115" y="110" width="180" height="70" rx="3" fill="#1c1404"/>
  <!-- Windows row 1 -->
  <rect x="125" y="118" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.5"/>
  <rect x="160" y="118" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.7"/>
  <rect x="195" y="118" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.3"/>
  <rect x="230" y="118" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.6"/>
  <rect x="265" y="118" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.4"/>
  <!-- Windows row 2 -->
  <rect x="125" y="147" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.4"/>
  <rect x="160" y="147" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.6"/>
  <rect x="195" y="147" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.7"/>
  <rect x="230" y="147" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.3"/>
  <rect x="265" y="147" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.5"/>
  <!-- Windows lower floor -->
  <rect x="100" y="185" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.4"/>
  <rect x="140" y="185" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.6"/>
  <rect x="180" y="185" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.5"/>
  <rect x="220" y="185" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.7"/>
  <rect x="260" y="185" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.3"/>
  <rect x="300" y="185" width="25" height="20" rx="2" fill="#fbbf24" opacity="0.5"/>
  <!-- Door -->
  <rect x="185" y="240" width="40" height="35" rx="3" fill="#0a0f07" stroke="#d97706" stroke-width="1"/>
  <circle cx="218" cy="258" r="3" fill="#d97706"/>
  <!-- BookInn sign -->
  <rect x="130" y="92" width="150" height="20" rx="3" fill="#d97706" opacity="0.9"/>
  <text x="205" y="106" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">BookInn</text>
  <!-- Stars -->
  <text x="160" y="90" font-family="Arial,sans-serif" font-size="11" fill="#fbbf24">★★★★</text>
  <!-- Ground -->
  <rect x="70" y="275" width="270" height="8" rx="3" fill="#2c1f04"/>

  <!-- Stats row below hotel -->
  <rect x="40" y="295" width="155" height="80" rx="6" fill="#0a0f07" stroke="#2c1f04" stroke-width="1"/>
  <text x="117" y="330" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f59e0b" text-anchor="middle">12</text>
  <text x="117" y="348" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Room Types</text>
  <text x="117" y="364" font-family="Arial,sans-serif" font-size="9" fill="#4b5563" text-anchor="middle">Managed via Admin</text>

  <rect x="210" y="295" width="155" height="80" rx="6" fill="#0a0f07" stroke="#2c1f04" stroke-width="1"/>
  <text x="287" y="330" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10b981" text-anchor="middle">Live</text>
  <text x="287" y="348" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Deployed on Vercel</text>
  <text x="287" y="364" font-family="Arial,sans-serif" font-size="9" fill="#4b5563" text-anchor="middle">bookinn.vercel.app</text>

  <!-- Tech stack -->
  <rect x="40" y="390" width="330" height="85" rx="8" fill="#0a0f07" stroke="#2c1f04" stroke-width="1"/>
  <text x="60" y="412" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Tech Stack</text>
  <rect x="60" y="420" width="55" height="22" rx="11" fill="#1c1404" stroke="#d97706" stroke-width="1"/>
  <text x="87" y="435" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">React</text>
  <rect x="125" y="420" width="70" height="22" rx="11" fill="#1c1404" stroke="#d97706" stroke-width="1"/>
  <text x="160" y="435" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">Node.js</text>
  <rect x="205" y="420" width="65" height="22" rx="11" fill="#1c1404" stroke="#d97706" stroke-width="1"/>
  <text x="237" y="435" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">MongoDB</text>
  <rect x="280" y="420" width="70" height="22" rx="11" fill="#1c1404" stroke="#d97706" stroke-width="1"/>
  <text x="315" y="435" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">Vercel</text>
  <rect x="60" y="450" width="65" height="22" rx="11" fill="#1c1404" stroke="#d97706" stroke-width="1"/>
  <text x="92" y="465" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">Express</text>
  <rect x="135" y="450" width="75" height="22" rx="11" fill="#1c1404" stroke="#d97706" stroke-width="1"/>
  <text x="172" y="465" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">Tailwind CSS</text>

  <!-- Report contents right panel -->
  <rect x="420" y="75" width="355" height="405" rx="8" fill="#0a0f07" stroke="#2c1f04" stroke-width="1"/>
  <text x="440" y="100" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Report Contents</text>

  <!-- Section list -->
  <rect x="440" y="110" width="315" height="1" fill="#2c1f04"/>

  <!-- Sections -->
  <text x="450" y="130" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#f59e0b">01  Project Overview &amp; Scope</text>
  <text x="450" y="145" font-family="Arial,sans-serif" font-size="10" fill="#6b7280">    Business context, objectives, and project boundaries</text>

  <rect x="440" y="152" width="315" height="1" fill="#1c2310"/>
  <text x="450" y="170" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#f59e0b">02  Stakeholder Analysis</text>
  <text x="450" y="185" font-family="Arial,sans-serif" font-size="10" fill="#6b7280">    Identification, roles, and interest/influence matrix</text>

  <rect x="440" y="192" width="315" height="1" fill="#1c2310"/>
  <text x="450" y="210" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#f59e0b">03  Functional Requirements</text>
  <text x="450" y="225" font-family="Arial,sans-serif" font-size="10" fill="#6b7280">    Use cases, user stories, acceptance criteria</text>

  <rect x="440" y="232" width="315" height="1" fill="#1c2310"/>
  <text x="450" y="250" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#f59e0b">04  System Design &amp; Architecture</text>
  <text x="450" y="265" font-family="Arial,sans-serif" font-size="10" fill="#6b7280">    Data flow diagrams, ER diagrams, component design</text>

  <rect x="440" y="272" width="315" height="1" fill="#1c2310"/>
  <text x="450" y="290" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#f59e0b">05  Booking Process Workflow</text>
  <text x="450" y="305" font-family="Arial,sans-serif" font-size="10" fill="#6b7280">    BPMN process maps for reservation &amp; admin flows</text>

  <rect x="440" y="312" width="315" height="1" fill="#1c2310"/>
  <text x="450" y="330" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#f59e0b">06  Testing &amp; Quality Assurance</text>
  <text x="450" y="345" font-family="Arial,sans-serif" font-size="10" fill="#6b7280">    Test cases, UAT plan, defect tracking</text>

  <rect x="440" y="352" width="315" height="1" fill="#1c2310"/>
  <text x="450" y="370" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#f59e0b">07  BA Value Addition</text>
  <text x="450" y="385" font-family="Arial,sans-serif" font-size="10" fill="#6b7280">    Gap analysis, process improvements, recommendations</text>

  <rect x="440" y="392" width="315" height="1" fill="#1c2310"/>
  <text x="450" y="410" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#f59e0b">08  Deployment &amp; Maintenance Plan</text>
  <text x="450" y="425" font-family="Arial,sans-serif" font-size="10" fill="#6b7280">    Release strategy, environment setup, future roadmap</text>

  <rect x="440" y="432" width="315" height="1" fill="#1c2310"/>

  <!-- Tags -->
  <rect x="440" y="445" width="65" height="22" rx="11" fill="#1c1404" stroke="#d97706" stroke-width="1"/>
  <text x="472" y="460" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">ICT Project</text>
  <rect x="515" y="445" width="75" height="22" rx="11" fill="#0c1a0c" stroke="#10b981" stroke-width="1"/>
  <text x="552" y="460" font-family="Arial,sans-serif" font-size="10" fill="#10b981" text-anchor="middle">University</text>
  <rect x="600" y="445" width="60" height="22" rx="11" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
  <text x="630" y="460" font-family="Arial,sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle">BA Docs</text>
  <rect x="670" y="445" width="75" height="22" rx="11" fill="#1c0505" stroke="#dc2626" stroke-width="1"/>
  <text x="707" y="460" font-family="Arial,sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">Full Report</text>
</svg>
